<h2>Catalogo de productos App</h2>
<div class="row">
  <div class="col-9">
    <app-catalog [products]="products" (productEventEmitter)="onAddCart($event)"></app-catalog>
  </div>
  <div class="col-3">
    @if (items.length > 0) {
      <app-cart [items]="items" (idProductEventEmmiter)="onDelete($event)"
      [total]="total"></app-cart>
    } @else {
      <div class="alert alert-warning">No hay elementos en el carro de compras</div>
    }
  </div>
</div>
